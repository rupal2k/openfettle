# Unsigned iOS test build (Debug, so its WebView is inspectable). A workflow artifact only:
# sideload it with your own Apple ID (Sideloadly), never attach it to a release.
name: iOS build
on:
  push:
    branches: [main, 'feat/ios*']
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web bundle and sync Capacitor (iOS)
        working-directory: frontend
        run: npm ci && npx vite build --mode mobile && npx cap sync ios
      - name: Build unsigned app
        working-directory: frontend/ios/App
        run: |
          VER=$(node -p "require('../../package.json').version")
          VC=$(grep -m1 -o 'versionCode [0-9]*' ../../android/app/build.gradle | cut -d' ' -f2)
          xcodebuild -list -workspace App.xcworkspace
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$VC" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir Payload
          cp -R frontend/ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -qr "OpenFettle-ios-${SHORT_SHA}-unsigned.ipa" Payload
          echo "IPA_NAME=OpenFettle-ios-${SHORT_SHA}-unsigned.ipa" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: openfettle-ios-unsigned
          path: ${{ env.IPA_NAME }}
          retention-days: 30
